<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Project workflow</title>
  <desc id="desc">Data loading, exploration, model training, prediction, and evaluation workflow</desc>
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="#F8FAFC"/>

  <g fill="none" stroke="#94A3B8" stroke-width="3">
    <path d="M210 130H248"/>
    <path d="M438 130H476"/>
    <path d="M666 130H704"/>
    <path d="M894 130H932"/>
  </g>
  <g fill="#94A3B8">
    <path d="M248 122L262 130L248 138Z"/>
    <path d="M476 122L490 130L476 138Z"/>
    <path d="M704 122L718 130L704 138Z"/>
    <path d="M932 122L946 130L932 138Z"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(40 55)">
      <rect width="170" height="150" rx="18" fill="url(#node)" stroke="#BFDBFE" stroke-width="2"/>
      <circle cx="85" cy="48" r="26" fill="#DBEAFE"/>
      <path d="M70 47H100M70 58H92M70 36H92" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
      <text x="85" y="103" fill="#0F172A" font-size="19" font-weight="700">Load data</text>
      <text x="85" y="128" fill="#64748B" font-size="14">284,807 records</text>
    </g>
    <g transform="translate(268 55)">
      <rect width="170" height="150" rx="18" fill="url(#node)" stroke="#A7F3D0" stroke-width="2"/>
      <circle cx="85" cy="48" r="26" fill="#D1FAE5"/>
      <path d="M70 60V43M82 60V32M94 60V38M106 60V28" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <text x="85" y="103" fill="#0F172A" font-size="19" font-weight="700">Explore</text>
      <text x="85" y="128" fill="#64748B" font-size="14">EDA + visuals</text>
    </g>
    <g transform="translate(496 55)">
      <rect width="170" height="150" rx="18" fill="url(#node)" stroke="#DDD6FE" stroke-width="2"/>
      <circle cx="85" cy="48" r="26" fill="#EDE9FE"/>
      <path d="M66 48L76 58L104 30" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="85" y="103" fill="#0F172A" font-size="19" font-weight="700">Split + train</text>
      <text x="85" y="128" fill="#64748B" font-size="14">80% / 20%</text>
    </g>
    <g transform="translate(724 55)">
      <rect width="170" height="150" rx="18" fill="url(#node)" stroke="#FED7AA" stroke-width="2"/>
      <circle cx="85" cy="48" r="26" fill="#FFEDD5"/>
      <circle cx="85" cy="48" r="14" fill="none" stroke="#EA580C" stroke-width="4"/>
      <circle cx="85" cy="48" r="4" fill="#EA580C"/>
      <text x="85" y="103" fill="#0F172A" font-size="19" font-weight="700">Random Forest</text>
      <text x="85" y="128" fill="#64748B" font-size="14">Predict classes</text>
    </g>
    <g transform="translate(952 55)">
      <rect width="170" height="150" rx="18" fill="url(#node)" stroke="#BAE6FD" stroke-width="2"/>
      <circle cx="85" cy="48" r="26" fill="#E0F2FE"/>
      <path d="M69 49L79 59L102 36" fill="none" stroke="#0284C7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="85" y="103" fill="#0F172A" font-size="19" font-weight="700">Evaluate</text>
      <text x="85" y="128" fill="#64748B" font-size="14">F1 + MCC + matrix</text>
    </g>
  </g>
</svg>
